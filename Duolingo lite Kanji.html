
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duolingo Japanese - 100 Kanji N5 Master (Auto-Hide Per Kategori)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --duo-green: #58cc02;
      --duo-green-dark: #58a700;
      --duo-green-light: #d7ffb8;
      --duo-green-text: #468c00;
      
      --duo-red: #ff4b4b;
      --duo-red-dark: #ea2b2b;
      --duo-red-light: #ffdfe0;
      --duo-red-text: #d32f2f;

      --duo-blue: #1cb0f6;
      --duo-blue-dark: #1899d6;
      --duo-blue-light: #ddf4ff;

      --duo-yellow: #ffc800;
      --duo-yellow-dark: #e5a400;

      /* LIGHT THEME */
      --duo-bg: #ffffff;
      --duo-page-bg: #f7f9fa;
      --duo-card-bg: #ffffff;
      --duo-sub-bg: #f0f3f5;
      --duo-input-bg: #f7f9fa;
      --duo-border: #e5e5e5;
      --duo-border-dark: #cecece;
      --duo-text: #3c3c3c;
      --duo-text-muted: #afafaf;
      --duo-text-sub: #777777;
      --duo-sheet-correct-bg: #d7ffb8;
      --duo-sheet-wrong-bg: #ffdfe0;
      --duo-sheet-tip-bg: rgba(255, 255, 255, 0.7);
      --duo-scrollbar: #d1d5db;
      --duo-scrollbar-hover: #9ca3af;
      --duo-scrollbar-track: #f0f3f5;
    }

    /* DARK THEME */
    body.dark-mode {
      --duo-bg: #18262d;
      --duo-page-bg: #131f24;
      --duo-card-bg: #202f36;
      --duo-sub-bg: #131f24;
      --duo-input-bg: #131f24;
      --duo-border: #37464f;
      --duo-border-dark: #27353d;
      --duo-text: #f1f5f9;
      --duo-text-muted: #8b9ca7;
      --duo-text-sub: #94a3b8;
      --duo-blue-light: #183344;
      --duo-green-light: #16361a;
      --duo-red-light: #381a1c;
      --duo-sheet-correct-bg: #14301a;
      --duo-sheet-wrong-bg: #38171a;
      --duo-sheet-tip-bg: rgba(0, 0, 0, 0.35);
      --duo-scrollbar: #37464f;
      --duo-scrollbar-hover: #4b5d68;
      --duo-scrollbar-track: #18262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'M PLUS Rounded 1c', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* UNIFIED SLEEK SCROLLBAR */
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: var(--duo-scrollbar-track);
      border-radius: 10px;
    }
    *::-webkit-scrollbar-thumb {
      background: var(--duo-scrollbar);
      border-radius: 10px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: var(--duo-scrollbar-hover);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--duo-scrollbar) var(--duo-scrollbar-track);
    }

    body {
      background-color: var(--duo-page-bg);
      color: var(--duo-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }

    /* DUOLINGO STYLE RUBY FURIGANA */
    ruby {
      ruby-align: center;
      ruby-position: over;
    }

    rt {
      font-size: 0.52em;
      color: var(--duo-blue);
      font-weight: 800;
      transform: translateY(-2px);
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    body.hide-furigana rt {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    body.hide-translation .trans-text,
    body.hide-translation .opt-trans,
    body.hide-translation .sentence-trans,
    body.hide-translation .list-item-trans {
      display: none !important;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      background: var(--duo-bg);
      border: 2px solid var(--duo-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      margin-bottom: 40px;
    }

    /* TOP TABS */
    .duo-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--duo-sub-bg);
      padding: 6px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .duo-tab-btn {
      padding: 12px 14px;
      background: transparent;
      border: none;
      color: var(--duo-text-sub);
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .duo-tab-btn.active {
      background: var(--duo-card-bg);
      color: var(--duo-blue);
      box-shadow: 0 4px 0 var(--duo-border);
    }

    .tab-pill {
      background: var(--duo-border);
      color: var(--duo-text-sub);
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 900;
    }

    .duo-tab-btn.active .tab-pill {
      background: var(--duo-blue-light);
      color: var(--duo-blue-dark);
    }

    body.dark-mode .duo-tab-btn.active .tab-pill {
      color: #38bdf8;
    }

    /* QUIZ HEADER */
    .quiz-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-exit {
      background: transparent;
      border: none;
      color: var(--duo-text-muted);
      font-size: 1.5rem;
      font-weight: 900;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .btn-exit:hover {
      color: var(--duo-red);
    }

    .progress-track {
      flex: 1;
      height: 16px;
      background: var(--duo-border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--duo-green);
      width: 0%;
      border-radius: 20px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 8px;
      right: 8px;
      height: 4px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 4px;
    }

    .header-toggles {
      display: flex;
      gap: 6px;
    }

    .duo-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--duo-text-sub);
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-radius: 14px;
      padding: 5px 8px;
      cursor: pointer;
      user-select: none;
    }

    .duo-toggle input {
      display: none;
    }

    .duo-toggle .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--duo-border-dark);
      transition: all 0.2s;
    }

    .duo-toggle input:checked + .dot {
      background: var(--duo-green);
      box-shadow: 0 0 6px rgba(88, 204, 2, 0.5);
    }

    /* SPEECH BUBBLE & MASCOT */
    .prompt-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .duo-mascot-svg {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      animation: gentleBounce 2s infinite ease-in-out;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .speech-bubble {
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-radius: 18px;
      padding: 12px 18px;
      position: relative;
      flex: 1;
      box-shadow: 0 3px 0 var(--duo-border);
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -9px;
      top: 16px;
      width: 14px;
      height: 14px;
      background: var(--duo-card-bg);
      border-left: 2px solid var(--duo-border);
      border-bottom: 2px solid var(--duo-border);
      transform: rotate(45deg);
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--duo-text);
      line-height: 1.4;
    }

    .category-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 900;
      color: var(--duo-blue);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    /* DISPLAY HERO CARD */
    .display-card {
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 0 var(--duo-border);
    }

    .kanji-hero {
      font-size: 4rem;
      font-weight: 900;
      color: var(--duo-text);
      line-height: 1.3;
      margin: 4px 0;
    }

    .sentence-hero {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 2.2;
      color: var(--duo-text);
    }

    .sentence-trans {
      font-size: 0.95rem;
      color: var(--duo-blue);
      font-weight: 700;
      margin-top: 4px;
    }

    .audio-play-btn {
      background: var(--duo-blue);
      border: none;
      border-bottom: 4px solid var(--duo-blue-dark);
      border-radius: 50%;
      width: 76px;
      height: 76px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      box-shadow: 0 6px 16px rgba(28, 176, 246, 0.3);
      margin: 10px auto;
    }

    .audio-play-btn:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }

    /* 3D CHUNKY OPTIONS */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 25px;
    }

    @media (max-width: 580px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .kanji-hero {
        font-size: 3.2rem;
      }
    }

    .duo-btn-opt {
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-bottom: 4px solid var(--duo-border-dark);
      border-radius: 18px;
      padding: 16px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      min-height: 90px;
      position: relative;
    }

    .duo-btn-opt:hover {
      filter: brightness(1.04);
      border-color: #64748b;
    }

    .duo-btn-opt:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .opt-number {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--duo-text-muted);
      border: 2px solid var(--duo-border);
      border-radius: 8px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .opt-kanji-text {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--duo-text);
      line-height: 1.4;
    }

    .opt-trans {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--duo-text-sub);
      margin-top: 4px;
    }

    .duo-btn-opt.correct {
      background: var(--duo-green-light) !important;
      border-color: var(--duo-green) !important;
      border-bottom: 4px solid var(--duo-green-dark) !important;
    }
    .duo-btn-opt.correct .opt-kanji-text {
      color: var(--duo-green-text) !important;
    }
    body.dark-mode .duo-btn-opt.correct .opt-kanji-text {
      color: #6ee7b7 !important;
    }

    .duo-btn-opt.wrong {
      background: var(--duo-red-light) !important;
      border-color: var(--duo-red) !important;
      border-bottom: 4px solid var(--duo-red-dark) !important;
    }
    .duo-btn-opt.wrong .opt-kanji-text {
      color: var(--duo-red-text) !important;
    }
    body.dark-mode .duo-btn-opt.wrong .opt-kanji-text {
      color: #fca5a5 !important;
    }

    /* TYPING BOX */
    .typing-card {
      margin-bottom: 25px;
    }

    .duo-input {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      background: var(--duo-input-bg);
      border: 2px solid var(--duo-border);
      border-bottom: 4px solid var(--duo-border-dark);
      color: var(--duo-text);
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }

    .duo-input:focus {
      border-color: var(--duo-blue);
      border-bottom-color: var(--duo-blue-dark);
    }

    /* BOTTOM ACTION SHEET */
    .bottom-sheet {
      margin-top: 15px;
      border-radius: 20px;
      padding: 18px;
      display: none;
      animation: sheetPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes sheetPop {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .bottom-sheet.correct-sheet {
      background: var(--duo-sheet-correct-bg);
      border: 2px solid var(--duo-green);
    }

    .bottom-sheet.wrong-sheet {
      background: var(--duo-sheet-wrong-bg);
      border: 2px solid var(--duo-red);
    }

    .sheet-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .correct-sheet .sheet-status { color: var(--duo-green-text); }
    body.dark-mode .correct-sheet .sheet-status { color: #6ee7b7; }

    .wrong-sheet .sheet-status { color: var(--duo-red-text); }
    body.dark-mode .wrong-sheet .sheet-status { color: #fca5a5; }

    .sheet-body {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--duo-text);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .sheet-tip {
      background: var(--duo-sheet-tip-bg);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--duo-text);
    }

    .btn-quick-exclude {
      background: transparent;
      border: 2px dashed var(--duo-red);
      color: var(--duo-red);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 14px;
      width: 100%;
      transition: all 0.15s;
    }

    .btn-quick-exclude:hover {
      background: var(--duo-red-light);
    }

    .btn-duo-cta {
      width: 100%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: none;
      background: var(--duo-green);
      color: #ffffff;
      border-bottom: 4px solid var(--duo-green-dark);
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-duo-cta:hover { filter: brightness(1.05); }
    .btn-duo-cta:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .btn-duo-cta.wrong-cta {
      background: var(--duo-red);
      border-bottom-color: var(--duo-red-dark);
    }

    /* RESULT SCREEN */
    #result-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .result-score-badge {
      display: inline-block;
      background: var(--duo-yellow);
      color: #ffffff;
      font-size: 2.4rem;
      font-weight: 900;
      padding: 10px 28px;
      border-radius: 24px;
      border-bottom: 5px solid var(--duo-yellow-dark);
      margin-bottom: 15px;
    }

    .review-scroll-box {
      max-height: 320px;
      overflow-y: auto;
      text-align: left;
      margin: 20px 0;
      padding-right: 6px;
    }

    .review-duo-item {
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    .review-duo-item.pass { border-color: var(--duo-green); }
    .review-duo-item.fail { border-color: var(--duo-red); }

    /* ================= TAB 2: GUIDEBOOK LIST ================= */
    #tab-kanji-list {
      display: none;
    }

    .guidebook-banner {
      background: var(--duo-blue);
      border-bottom: 4px solid var(--duo-blue-dark);
      border-radius: 20px;
      padding: 18px;
      color: white;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .guidebook-title {
      font-size: 1.3rem;
      font-weight: 900;
    }

    .guidebook-sub {
      font-size: 0.88rem;
      opacity: 0.9;
      font-weight: 700;
    }

    /* UTILITY BAR (AUTO-HIDE TOGGLE & COUNTER INFO) */
    .list-utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .active-filter-indicator {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--duo-blue);
    }

    /* HORIZONTAL FILTER PILLS */
    .filter-pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 10px 2px;
      margin-bottom: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--duo-scrollbar) var(--duo-scrollbar-track);
      -webkit-overflow-scrolling: touch;
    }

    .filter-pills-row::-webkit-scrollbar {
      height: 6px;
    }

    .duo-filter-chip {
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-bottom: 3px solid var(--duo-border-dark);
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--duo-text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .duo-filter-chip.active {
      background: var(--duo-blue-light);
      border-color: var(--duo-blue);
      border-bottom-color: var(--duo-blue-dark);
      color: var(--duo-blue-dark);
    }
    body.dark-mode .duo-filter-chip.active {
      color: #38bdf8;
    }

    .duo-search-bar {
      width: 100%;
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--duo-input-bg);
      border: 2px solid var(--duo-border);
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--duo-text);
      outline: none;
      margin-bottom: 12px;
    }

    .duo-search-bar:focus {
      border-color: var(--duo-blue);
    }

    .kanji-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .guide-kanji-card {
      background: var(--duo-card-bg);
      border: 2px solid var(--duo-border);
      border-bottom: 4px solid var(--duo-border-dark);
      border-radius: 20px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
    }

    .guide-kanji-card:hover {
      transform: translateY(-2px);
    }

    .guide-kanji-card.mastered {
      background: var(--duo-green-light);
      border-color: var(--duo-green);
      border-bottom-color: var(--duo-green-dark);
    }

    .guide-kanji-card.excluded {
      opacity: 0.6;
      border-style: dashed;
    }

    .card-top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .btn-card-action {
      background: var(--duo-sub-bg);
      border: 1px solid var(--duo-border);
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 900;
      cursor: pointer;
      color: var(--duo-text-sub);
      transition: all 0.1s;
    }

    .btn-card-action.active-excluded {
      background: var(--duo-red-light);
      border-color: var(--duo-red);
      color: var(--duo-red-text);
    }

    .card-category-tag {
      font-size: 0.68rem;
      font-weight: 900;

// ================= AUDIO ENGINE (HANYA BACA KANJI/KANA TANPA RT) =================
function playJapaneseAudio(text) {
  if (!('speechSynthesis' in window)) return;

  // Hentikan suara yang sedang berjalan agar suara baru langsung keluar seketika
  window.speechSynthesis.cancel();

  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = text;

  // HAPUS SEMUA TAG <rt> DARI TEKS YANG AKAN DIBACA TTS
  tempDiv.querySelectorAll('rt').forEach(rt => rt.remove());
  tempDiv.querySelectorAll('.opt-trans, .trans-text, .list-item-trans').forEach(el => el.remove());

  let cleanText = (tempDiv.textContent || tempDiv.innerText || text).trim();
  cleanText = cleanText.replace(/\([^\)]*\)/g, '').trim();

  if (!cleanText) return;

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'ja-JP';
  utterance.rate = 0.88;

  const voices = window.speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang.startsWith('ja') || v.lang === 'ja_JP');
  if (jaVoice) utterance.voice = jaVoice;

  window.speechSynthesis.speak(utterance);
}

// ================= THEME & STORAGE LOGIC (KUNCI BERDASARKAN KATA KANJI MURNI) =================
const STORAGE_KEY = 'duolingo_kanji_mastered_words_v2';
const EXCLUDED_STORAGE_KEY = 'duolingo_kanji_excluded_words_v2';
const THEME_KEY = 'duolingo_kanji_theme_mode';
const AUTOHIDE_KEY = 'duolingo_kanji_autohide_mode_v2';

let masteredKanjiWords = new Set();
let excludedKanjiWords = new Set();
let autoHideMastered = false;

function initTheme() {
  const savedTheme = localStorage.getItem(THEME_KEY);
  const toggle = document.getElementById('dark-mode-toggle');
  
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark-mode');
    toggle.checked = true;
    document.getElementById('theme-icon').innerText = '☀️';
  } else {
    document.body.classList.remove('dark-mode');
    toggle.checked = false;
    document.getElementById('theme-icon').innerText = '🌙';
  }
}

function toggleDarkMode(isDark) {
  if (isDark) {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-icon').innerText = '☀️';
    localStorage.setItem(THEME_KEY, 'dark');
  } else {
    document.body.classList.remove('dark-mode');
    document.getElementById('theme-icon').innerText = '🌙';
    localStorage.setItem(THEME_KEY, 'light');
  }
}

function loadStorageData() {
  try {
    const savedMastered = localStorage.getItem(STORAGE_KEY);
    if (savedMastered) masteredKanjiWords = new Set(JSON.parse(savedMastered));
    
    const savedExcluded = localStorage.getItem(EXCLUDED_STORAGE_KEY);
    if (savedExcluded) excludedKanjiWords = new Set(JSON.parse(savedExcluded));

    const savedAutoHide = localStorage.getItem(AUTOHIDE_KEY);
    if (savedAutoHide !== null) {
      autoHideMastered = (savedAutoHide === 'true');
      document.getElementById('autohide-toggle').checked = autoHideMastered;
    }
  } catch (e) {
    masteredKanjiWords = new Set();
    excludedKanjiWords = new Set();
    autoHideMastered = false;
  }
  updateMasteredUIStats();
}

function saveMasteredToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...masteredKanjiWords]));
  } catch (e) {}
  updateMasteredUIStats();
}

function saveExcludedToStorage() {
  try {
    localStorage.setItem(EXCLUDED_STORAGE_KEY, JSON.stringify([...excludedKanjiWords]));
  } catch (e) {}
  updateMasteredUIStats();
}

function toggleAutoHideMastered(checked) {
  autoHideMastered = checked;
  try {
    localStorage.setItem(AUTOHIDE_KEY, checked ? 'true' : 'false');
  } catch (e) {}
  renderKanjiList();
}

function toggleMasteredWord(plainWord, event) {
  if (event) event.stopPropagation();
  if (masteredKanjiWords.has(plainWord)) {
    masteredKanjiWords.delete(plainWord);
  } else {
    masteredKanjiWords.add(plainWord);
  }
  saveMasteredToStorage();
  renderKanjiList();
}

function toggleExcludedWord(plainWord, event) {
  if (event) event.stopPropagation();
  if (excludedKanjiWords.has(plainWord)) {
    excludedKanjiWords.delete(plainWord);
  } else {
    excludedKanjiWords.add(plainWord);
  }
  saveExcludedToStorage();
  renderKanjiList();
}

function quickExcludeCurrentKanji() {
  const currentQ = quizData[currentIndex];
  if (!currentQ || !currentQ.targetWord) return;

  excludedKanjiWords.add(currentQ.targetWord);
  saveExcludedToStorage();

  const btn = document.getElementById('btn-quick-exclude');
  btn.innerText = `✅ Kanji "${currentQ.targetWord}" Berhasil Dinonaktifkan dari Kuis!`;
  btn.style.borderColor = 'var(--duo-green)';
  btn.style.color = 'var(--duo-green-text)';
  btn.disabled = true;
}

function updateMasteredUIStats() {
  const total = kanjiMasterList.length;
  const count = masteredKanjiWords.size;
  const excludedCount = excludedKanjiWords.size;
  const activeCount = total - excludedCount;
  const pct = Math.round((count / total) * 100);

  document.getElementById('nav-mastered-count').innerText = `${count}/${total}`;
  document.getElementById('nav-quiz-count').innerText = `${Math.min(50, activeCount)} Soal`;
  document.getElementById('mastered-stats-text').innerText = `${count} dari ${total} Dikuasai (${pct}%) • ${excludedCount} Dikeluarkan dari Kuis`;
}

// ================= TAB NAVIGATION =================
function switchDuoTab(tabName) {
  const btnQuiz = document.getElementById('tab-btn-quiz');
  const btnList = document.getElementById('tab-btn-list');
  const tabQuiz = document.getElementById('tab-quiz');
  const tabList = document.getElementById('tab-kanji-list');

  if (tabName === 'quiz') {
    btnQuiz.classList.add('active');
    btnList.classList.remove('active');
    tabQuiz.style.display = 'block';
    tabList.style.display = 'none';
  } else {
    btnQuiz.classList.remove('active');
    btnList.classList.add('active');
    tabQuiz.style.display = 'none';
    tabList.style.display = 'block';
    renderKanjiList();
  }
}

// ================= LIST TAB FILTER & RENDER (DENGAN AUTO-HIDE PER KATEGORI) =================
let currentFilter = 'all';

function setListFilter(filter, btnElement) {
  currentFilter = filter;
  const chips = document.querySelectorAll('.duo-filter-chip');
  chips.forEach(b => b.classList.remove('active'));
  btnElement.classList.add('active');
  renderKanjiList();
}

function filterKanjiList() {
  renderKanjiList();
}

function renderKanjiList() {
  const container = document.getElementById('kanji-cards-container');
  const searchQuery = document.getElementById('search-kanji').value.trim().toLowerCase();
  const filterInfo = document.getElementById('category-filter-info');
  container.innerHTML = '';

  // Hitung jumlah di kategori saat ini
  let totalInCategory = 0;
  let hiddenMasteredCount = 0;

  const filtered = kanjiMasterList.filter(item => {
    const isMastered = masteredKanjiWords.has(item.plain);
    const isExcluded = excludedKanjiWords.has(item.plain);

    // Cek kecocokan kategori/filter tab
    let matchesCategory = true;
    if (currentFilter === 'mastered') {
      matchesCategory = isMastered;
    } else if (currentFilter === 'excluded') {
      matchesCategory = isExcluded;
    } else if (currentFilter !== 'all') {
      matchesCategory = (item.category === currentFilter);
    }

    if (!matchesCategory) return false;
    totalInCategory++;

    // Jika fitur AUTO-HIDE aktif, sembunyikan yang sudah bermahkota/hafal
    if (autoHideMastered && isMastered && currentFilter !== 'mastered') {
      hiddenMasteredCount++;
      return false;
    }

    // Filter Pencarian
    if (searchQuery) {
      return item.plain.toLowerCase().includes(searchQuery) ||
             item.romaji.toLowerCase().includes(searchQuery) ||
             item.meaning.toLowerCase().includes(searchQuery);
    }
    return true;
  });

  // Perbarui Teks Info Filter
  let categoryLabel = (currentFilter === 'all') ? 'Semua' : currentFilter;
  if (autoHideMastered && hiddenMasteredCount > 0) {
    filterInfo.innerText = `Menampilkan ${filtered.length} dari ${totalInCategory} ${categoryLabel} (${hiddenMasteredCount} hafal disembunyikan)`;
  } else {
    filterInfo.innerText = `Kategori: ${categoryLabel} (${filtered.length} kanji)`;
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; color: var(--duo-text-muted); padding: 35px 20px; font-weight:800;">
        <div style="font-size: 2.5rem; margin-bottom: 8px;">🎉</div>
        Semua kanji pada kategori ini sudah kamu tandai hafal!<br>
        <span style="font-size: 0.85rem; font-weight: 700; opacity: 0.8;">Matikan tombol "Sembunyikan yang Sudah Hafal" jika ingin melihatnya kembali.</span>
      </div>
    `;
    return;
  }

  filtered.forEach(item => {
    const isMastered = masteredKanjiWords.has(item.plain);
    const isExcluded = excludedKanjiWords.has(item.plain);

    const card = document.createElement('div');
    card.className = `guide-kanji-card ${isMastered ? 'mastered' : ''} ${isExcluded ? 'excluded' : ''}`;
    
    card.onclick = () => {
      playJapaneseAudio(item.audio || item.plain);
      toggleMasteredWord(item.plain);
    };

    card.innerHTML = `
      <div class="card-top-badges">
        <span class="card-category-tag">${item.category}</span>
        <div style="display:flex; gap:4px; align-items:center;">
          <button class="btn-card-action ${isExcluded ? 'active-excluded' : ''}" onclick="toggleExcludedWord('${item.plain}', event)" title="${isExcluded ? 'Aktifkan lagi di kuis' : 'Keluarkan dari kuis'}">
            ${isExcluded ? '🚫 Dikeluarkan' : '🎯 Di Kuis'}
          </button>
          ${isMastered ? '<span>👑</span>' : ''}
        </div>
      </div>
      <div class="card-kanji-val">${item.ruby}</div>
      <div class="card-romaji-val">${item.romaji}</div>
      <div class="card-trans-val">${item.meaning}</div>
      <button class="btn-audio-mini" onclick="event.stopPropagation(); playJapaneseAudio('${item.audio || item.plain}')" title="Dengarkan">🔊</button>
    `;
    container.appendChild(card);
  });
}

// ================= QUIZ APP ENGINE (ROLL BERDASARKAN KATA KANJI AKTIF) =================
const SESSION_QUESTION_COUNT = 50;
let quizData = [];
let currentIndex = 0;
let score = 0;
let hasAnswered = false;
let userReviews = [];

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function toggleFurigana(show) {
  if (show) {
    document.body.classList.remove('hide-furigana');
  } else {
    document.body.classList.add('hide-furigana');
  }
}

function toggleTranslation(show) {
  if (show) {
    document.body.classList.remove('hide-translation');
  } else {
    document.body.classList.add('hide-translation');
  }
}

function initQuiz() {
  // FILTER KELUAR SOAL BERDASARKAN KATA KANJI MURNI
  const availableQuestions = questionBank.filter(q => !excludedKanjiWords.has(q.targetWord));

  if (availableQuestions.length === 0) {
    alert("Semua kanji sedang dikeluarkan dari kuis! Buka tab 'Buku Kanji' lalu klik tombol '🚫 Dikeluarkan' untuk mengaktifkannya kembali.");
    switchDuoTab('list');
    return;
  }

  const sessionCount = Math.min(SESSION_QUESTION_COUNT, availableQuestions.length);
  const randomized = shuffle(availableQuestions);
  quizData = randomized.slice(0, sessionCount);
  
  currentIndex = 0;
  score = 0;
  userReviews = [];
  document.getElementById('quiz-body-area').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  hasAnswered = false;
  const q = quizData[currentIndex];

  const progressPct = ((currentIndex) / quizData.length) * 100;
  document.getElementById('progress-fill').style.width = `${progressPct}%`;

  const sheet = document.getElementById('bottom-sheet');
  sheet.style.display = 'none';
  sheet.className = 'bottom-sheet';

  // Reset Tombol Eksklusi Cepat di Lembar Jawaban
  const excludeBtn = document.getElementById('btn-quick-exclude');
  excludeBtn.disabled = false;
  excludeBtn.style.borderColor = 'var(--duo-red)';
  excludeBtn.style.color = 'var(--duo-red)';
  excludeBtn.innerText = `🚫 Jangan Munculkan Kanji "${q.targetWord}" Lagi di Kuis`;

  document.getElementById('category-chip').innerText = q.category;
  document.getElementById('question-prompt').innerText = q.prompt;

  const displayContent = document.getElementById('display-content');
  const optContainer = document.getElementById('options-container');
  const typingContainer = document.getElementById('typing-container');
  const typingInput = document.getElementById('typing-input');

  if (q.type === 'hearing') {
    displayContent.innerHTML = `<button class="audio-play-btn" onclick="playJapaneseAudio('${q.audioText}')" title="Putar Suara">🔊</button>`;
    optContainer.style.display = 'grid';
    typingContainer.style.display = 'none';
    renderOptions(q.options);
    setTimeout(() => playJapaneseAudio(q.audioText), 200);

  } else if (q.type === 'reading') {
    displayContent.innerHTML = `<div class="kanji-hero">${q.display}</div>`;
    optContainer.style.display = 'grid';
    typingContainer.style.display = 'none';
    renderOptions(q.options);

  } else if (q.type === 'typing') {
    displayContent.innerHTML = `<div class="kanji-hero">${q.display}</div>`;
    optContainer.style.display = 'none';
    typingContainer.style.display = 'block';
    typingInput.value = '';
    typingInput.disabled = false;
    setTimeout(() => typingInput.focus(), 100);

  } else if (q.type === 'meaning') {
    displayContent.innerHTML = `<div class="kanji-hero" style="font-size: 2.2rem; color: var(--duo-blue);">"${q.display}"</div>`;
    optContainer.style.display = 'grid';
    typingContainer.style.display = 'none';
    renderOptions(q.options);

  } else if (q.type === 'context') {
    displayContent.innerHTML = `
      <div class="sentence-hero">${q.sentence}</div>
      <div class="sentence-trans">Arti: "${q.sentenceMeaning}"</div>
    `;
    optContainer.style.display = 'grid';
    typingContainer.style.display = 'none';
    renderOptions(q.options);
  }
}

function renderOptions(options) {
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  const shuffled = shuffle(options);

  shuffled.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'duo-btn-opt';
    btn.innerHTML = `
      <span class="opt-number">${idx + 1}</span>
      <span class="opt-kanji-text">${opt.kanji}</span>
      <span class="opt-trans">${opt.meaning}</span>
    `;

    btn.onclick = () => {
      // Putar suara opsi yang ditekan seketika
      playJapaneseAudio(opt.kanji || opt.romaji);
      selectOption(btn, opt, shuffled);
    };

    container.appendChild(btn);
  });
}

function selectOption(btnElement, selectedOpt, allOptions) {
  // JIKA SUDAH MENJAWAB: Tetap putar suaranya, tapi jawaban terkunci tidak bisa diubah!
  if (hasAnswered) {
    return;
  }
  
  // KUNCI JAWABAN PERTAMA KALI
  hasAnswered = true;

  const q = quizData[currentIndex];
  const correctOpt = allOptions.find(o => o.isCorrect);

  if (selectedOpt.isCorrect) {
    btnElement.classList.add('correct');
    showFeedback(true, q, selectedOpt, correctOpt);
  } else {
    btnElement.classList.add('wrong');
    // Highlight opsi yang benar
    const allButtons = document.querySelectorAll('.duo-btn-opt');
    allButtons.forEach((b, idx) => {
      if (allOptions[idx].isCorrect) {
        b.classList.add('correct');
      }
    });
    showFeedback(false, q, selectedOpt, correctOpt);
  }
}

function submitTypingAnswer() {
  if (hasAnswered) return;
  const input = document.getElementById('typing-input');
  const userAns = input.value.trim().toLowerCase();

  if (!userAns) return;

  hasAnswered = true;
  input.disabled = true;

  const q = quizData[currentIndex];
  const isCorrect = q.correctAnswers.some(ans => ans.toLowerCase() === userAns);

  playJapaneseAudio(q.targetWord || q.display);

  showFeedback(isCorrect, q, { kanji: userAns, meaning: 'Jawaban ketikanmu' }, { kanji: q.kanjiRuby || q.display, meaning: q.meaning || '' });
}

function showFeedback(isCorrect, q, selectedOpt, correctOpt) {
  if (isCorrect) score++;

  userReviews.push({
    kanji: q.kanjiRuby || q.display || correctOpt.kanji,
    romaji: q.romaji || correctOpt.romaji || '',
    meaning: q.meaning || correctOpt.meaning || '',
    isCorrect: isCorrect
  });

  const sheet = document.getElementById('bottom-sheet');
  const sheetIcon = document.getElementById('sheet-icon');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetBody = document.getElementById('sheet-body');
  const nextBtn = document.getElementById('btn-sheet-next');

  sheet.style.display = 'block';

  if (isCorrect) {
    sheet.className = 'bottom-sheet correct-sheet';
    sheetIcon.innerText = '✅';
    sheetTitle.innerText = 'Luar biasa! (正解)';
    sheetBody.innerHTML = `
      <div><strong>Jawaban:</strong> <span style="font-size:1.2em;">${correctOpt.kanji}</span> ${correctOpt.romaji ? `(${correctOpt.romaji})` : ''} = <em>${correctOpt.meaning}</em></div>
      <div class="sheet-tip">💡 <strong>Catatan:</strong> ${q.explanation}</div>
    `;
    nextBtn.className = 'btn-duo-cta';
    nextBtn.innerText = 'Lanjut ➔';
  } else {
    sheet.className = 'bottom-sheet wrong-sheet';
    sheetIcon.innerText = '❌';
    sheetTitle.innerText = 'Kurang tepat!';
    sheetBody.innerHTML = `
      <div>👉 <strong>Pilihanmu:</strong> <span style="font-size:1.15em;">${selectedOpt.kanji}</span> = <em>${selectedOpt.meaning}</em></div>
      <div>👉 <strong>Jawaban Benar:</strong> <span style="font-size:1.2em; color:var(--duo-green-text);">${correctOpt.kanji}</span> ${correctOpt.romaji ? `(${correctOpt.romaji})` : ''} = <em>${correctOpt.meaning}</em></div>
      <div class="sheet-tip">💡 <strong>Kenapa salah?</strong> ${q.explanation}</div>
    `;
    nextBtn.className = 'btn-duo-cta wrong-cta';
    nextBtn.innerText = 'Mengerti ➔';
  }

  nextBtn.focus();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < quizData.length) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-body-area').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '<h4 style="margin-bottom: 12px; font-weight:900;">Evaluasi Sesi Ini:</h4>';

  userReviews.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = `review-duo-item ${item.isCorrect ? 'pass' : 'fail'}`;
    div.innerHTML = `
      <div>
        <strong>${idx + 1}. </strong>
        <span style="font-size: 1.15em; margin-right: 4px;">${item.kanji}</span> 
        <span style="color: var(--duo-text-sub);">(${item.romaji})</span> — ${item.meaning}
      </div>
      <div>${item.isCorrect ? '✅' : '❌'}</div>
    `;
    reviewList.appendChild(div);
  });
}

function restartQuiz() {
  initQuiz();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (!hasAnswered && quizData[currentIndex]?.type === 'typing') {
      submitTypingAnswer();
    } else if (hasAnswered && document.getElementById('bottom-sheet').style.display === 'block') {
      nextQuestion();
    }
  }
});

// STARTUP INITIALIZATION
window.onload = () => {
  initTheme();
  loadStorageData();
  initQuiz();
};
</script>
